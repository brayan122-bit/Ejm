<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inscripción Asistencias Enel Bienestar 360</title>
<style>
:root{
  --red:#E61400; --red-dark:#B30F00; --red-tint:#FFF3F0;
  --blue:#0555FA; --green:#2F8F3A; --orange:#FF5A0F; --orange-text:#A83A00; --orange-tint:#FFF4EC;
  --ink:#262626; --muted:#626873; --line:#DDE1E7; --surface:#F4F5F7;
  --field:#EEF3FF; --field-line:#A9BEEB;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#fff;font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid rgba(5,85,250,.45);outline-offset:2px}

/* Encabezado */
.top{background:var(--red);color:#fff}
.top-in{max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.top img{height:24px;display:block}
.top .ttl{border-left:1px solid rgba(255,255,255,.45);padding-left:16px}
.top h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.1px}
.top p{margin:1px 0 0;font-size:12.5px;opacity:.92}
.session{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:13px;flex-wrap:wrap}
@media (max-width:640px){
  .top-in{padding:10px 16px;gap:8px 12px}
  .top img{height:17px}
  .top .ttl{padding-left:12px;flex:1;min-width:0}
  .top h1{font-size:14.5px}
  .top p{display:none}
  .session{margin-left:0;width:100%;gap:8px;justify-content:space-between}
  .session .count{display:none}
  .session{flex-wrap:nowrap}
  .btn-w{padding:6px 10px;font-size:12px}
  .link-w{font-size:12px}
  .step-h h2{font-size:22px}
}
.session .count{background:rgba(255,255,255,.16);border-radius:20px;padding:6px 12px;white-space:nowrap}
.btn-w{background:#fff;color:var(--red);border:0;border-radius:6px;padding:8px 12px;font-weight:700;font-size:13px}
.btn-w:disabled{opacity:.55;cursor:not-allowed}
.link-w{color:#fff;font-size:12.5px;text-decoration:underline;text-underline-offset:2px;background:none;border:0;padding:0}

/* Pasos */
.rail{background:var(--surface);border-bottom:1px solid var(--line)}
.rail ol{max-width:1180px;margin:0 auto;padding:0 12px;display:flex;list-style:none;overflow-x:auto;scrollbar-width:none}
.rail ol::-webkit-scrollbar{display:none}
.rail li{flex:0 0 auto}
.rail button{background:none;border:0;padding:13px 10px;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13.5px;border-bottom:3px solid transparent;white-space:nowrap}
.rail button:disabled{cursor:default}
.rail .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;border:1.5px solid #B7BDC7;color:var(--muted);background:#fff}
.rail .cur button{color:var(--ink);font-weight:700;border-bottom-color:var(--red)}
.rail .cur .n{background:var(--red);border-color:var(--red);color:#fff}
.rail .done .n{background:var(--green);border-color:var(--green);color:#fff}
.rail .skip button{opacity:.55}
.rail .skip small{font-size:11px}

/* Estructura */
.layout{max-width:1180px;margin:0 auto;padding:28px 20px 130px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:36px;align-items:start}
@media (max-width:960px){.layout{grid-template-columns:1fr;gap:22px;padding-top:20px}}
.step-h h2{font-size:25px;line-height:1.2;margin:0 0 6px}
.step-h p{margin:0 0 22px;color:var(--muted);max-width:62ch}

/* Campos */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px 14px}
.f{grid-column:span 12;min-width:0}
@media (min-width:640px){.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}}
label,.lab{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.opt{color:#9AA0A8}
input[type=text],input[type=email],input[type=tel],select,textarea{width:100%;height:46px;border:1px solid var(--field-line);background:var(--field);border-radius:6px;padding:0 12px;font:inherit;color:var(--ink);appearance:none;-webkit-appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,#6F83B3 50%),linear-gradient(135deg,#6F83B3 50%,transparent 50%);background-position:calc(100% - 18px) 20px,calc(100% - 13px) 20px;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
textarea{height:84px;padding:10px 12px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(5,85,250,.18)}
.err input,.err select,.err textarea,.err .seg{border-color:var(--red);background:var(--red-tint)}
.msg{font-size:12.5px;color:var(--red-dark);margin-top:5px;min-height:0}
.msg:empty{display:none}

/* Selector segmentado */
.seg{display:flex;border:1px solid var(--field-line);border-radius:6px;overflow:hidden;background:var(--field)}
.seg button{flex:1;min-height:46px;border:0;background:transparent;color:var(--ink);padding:8px 10px;font-size:14px;border-right:1px solid var(--field-line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--red);color:#fff;font-weight:700}
.seg.v{flex-direction:column}
.seg.v button{text-align:left;border-right:0;border-bottom:1px solid var(--field-line);padding:12px 14px}
.seg.v button:last-child{border-bottom:0}

/* Planes */
.pgroup{margin-bottom:22px}
.pgroup-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:8px}
.pgroup-h h3{font-size:16px;margin:0}
.clear{background:none;border:0;color:var(--blue);font-size:13px;padding:0;text-decoration:underline;text-underline-offset:2px}
.opts{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.po{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,210px);gap:12px;align-items:center;width:100%;text-align:left;background:#fff;border:0;border-bottom:1px solid var(--line);padding:12px 14px;min-height:56px;color:var(--ink);border-left:4px solid transparent}
.po:last-child{border-bottom:0}
.po:hover{background:#FAFBFC}
.po .dot{width:20px;height:20px;border-radius:50%;border:1.5px solid #6F83B3;display:grid;place-items:center;background:#fff}
.po[aria-checked=true]{background:var(--red-tint);border-left-color:var(--red)}
.po[aria-checked=true] .dot{border-color:var(--red)}
.po[aria-checked=true] .dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--red)}
.po b{display:block;font-size:15px}
.po small{display:block;color:var(--muted);font-size:12.5px}
.po .cov{font-size:13px;color:var(--ink)}
.pol{display:inline-block;margin-top:3px;font-size:11.5px;color:#9B0C49;background:#FFE7F0;border-radius:3px;padding:1px 6px}
@media (max-width:560px){.po{grid-template-columns:24px minmax(0,1fr)}.po .cov{grid-column:2;color:var(--muted);font-size:12.5px;margin-top:-6px}}

/* Personas */
.block{margin-bottom:26px}
.block h3{font-size:16px;margin:0 0 4px}
.block > p{margin:0 0 12px;color:var(--muted);font-size:13.5px}
.person{border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:12px;background:#fff}
.person-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.person-h strong{font-size:14.5px}
.rm{background:none;border:0;color:var(--red-dark);font-size:13px;text-decoration:underline;text-underline-offset:2px;padding:4px}
.add{width:100%;min-height:48px;border:1.5px dashed var(--field-line);border-radius:8px;background:#fff;color:var(--blue);font-weight:700;font-size:14px}
.add:hover{background:#F6F9FF}
.empty{border:1px solid var(--line);border-radius:8px;padding:22px;background:var(--surface)}
.empty strong{display:block;margin-bottom:4px}
.total{display:inline-block;margin:4px 0 12px;font-size:13.5px;padding:5px 10px;border-radius:4px;background:var(--surface)}
.total.ok{background:#EAF6EC;color:var(--green)}
.total.bad{background:var(--red-tint);color:var(--red-dark)}

/* Avisos */
.notice{border-radius:8px;padding:12px 14px;margin:0 0 18px;font-size:14px}
.notice ul{margin:6px 0 0;padding-left:18px}
.notice.warn{background:var(--orange-tint);color:var(--orange-text);border-left:4px solid var(--orange)}
.notice.bad{background:var(--red-tint);color:var(--red-dark);border-left:4px solid var(--red)}
.notice.info{background:#EEF3FF;color:#173A8C;border-left:4px solid var(--blue)}
.notice.ok{background:#EAF6EC;color:#1F6B29;border-left:4px solid var(--green)}

/* Autorizaciones y firma */
.chk{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;padding:14px;border:1px solid var(--line);border-radius:8px;margin-bottom:10px;cursor:pointer;background:#fff}
.chk input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--red)}
.chk span{font-size:13.5px;line-height:1.5}
.chk.err{border-color:var(--red);background:var(--red-tint)}
.pad-wrap{border:1.5px dashed #8FA3CF;border-radius:8px;background:#fff;position:relative;user-select:none;-webkit-user-select:none}
.pad-wrap canvas{display:block;width:100%;height:190px;touch-action:none;cursor:crosshair}
.pad-line{position:absolute;left:24px;right:24px;bottom:44px;border-top:1px solid #C9D1E2;pointer-events:none}
.pad-hint{position:absolute;left:24px;bottom:18px;font-size:12.5px;color:#8A93A3;pointer-events:none}
.pad-tools{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:13px;color:var(--muted)}

/* Revisión */
.sum{border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:16px}
.sum-row{display:grid;grid-template-columns:170px minmax(0,1fr);gap:14px;padding:11px 14px;border-bottom:1px solid var(--line);font-size:14px}
.sum-row:last-child{border-bottom:0}
.sum-row dt{color:var(--muted);margin:0}
.sum-row dd{margin:0}
@media (max-width:560px){.sum-row{grid-template-columns:1fr;gap:2px}}
.edit{background:none;border:0;color:var(--blue);padding:0;font-size:13px;text-decoration:underline;text-underline-offset:2px;margin-left:6px}
table.reg{width:100%;border-collapse:collapse;font-size:13.5px}
table.reg th,table.reg td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.reg th{font-weight:700;color:var(--muted);font-size:12.5px;background:var(--surface)}
.done-box{border-radius:10px;padding:20px;background:#EAF6EC;margin-bottom:18px}
.done-box h3{margin:0 0 4px;color:#1F6B29}
.row-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btn{min-height:46px;border-radius:6px;padding:0 18px;font-weight:700;font-size:14.5px;border:1.5px solid transparent}
.btn.primary{background:var(--red);color:#fff}
.btn.primary:hover{background:var(--red-dark)}
.btn.ghost{background:#fff;color:var(--ink);border-color:#C3C9D3}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* Panel de cobertura */
.cover{position:sticky;top:16px}
@media (max-width:960px){.cover{position:static}}
.cover-card{background:var(--surface);border-radius:12px;padding:20px}
.cover-card h3{font-size:15px;margin:0 0 14px}
.people{display:flex;align-items:flex-end;justify-content:space-between;gap:2px;padding:14px 10px;background:#fff;border-radius:10px;margin-bottom:14px;min-height:78px}
.people .sep{width:1px;align-self:stretch;background:var(--line);margin:0 3px}
.fig{display:block;transition:opacity .2s}
.fig .b{fill:#fff;stroke:#C2C8D2;stroke-width:1.6}
.fig.open .b{stroke:var(--red)}
.fig.on .b{fill:var(--red);stroke:var(--red)}
.fig.off{opacity:.35}
.fig.dash .b{stroke-dasharray:3 2}
.fig.on.dash .b{stroke-dasharray:none}
.legend{list-style:none;margin:0 0 14px;padding:0;font-size:13px}
.legend li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.legend li:last-child{border-bottom:0}
.legend .st{color:var(--muted);text-align:right}
.legend .st.y{color:var(--ink);font-weight:700}
.chosen{font-size:13px;margin:0;padding:0;list-style:none}
.chosen li{padding:3px 0}
.chosen .none{color:var(--muted)}

/* Barra de acciones */
.actions{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:5;padding-bottom:env(safe-area-inset-bottom)}
.actions-in{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:12px}
.actions .where{color:var(--muted);font-size:13px;margin-right:auto}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:8px;font-size:14px;z-index:9;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Modalidad */
.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.mod{display:grid;grid-template-columns:22px 1fr;grid-template-rows:auto auto auto;gap:2px 10px;align-items:start;text-align:left;background:#fff;border:1px solid var(--line);border-radius:8px;padding:13px 14px;color:var(--ink)}
.mod .dot{grid-row:1/4;width:20px;height:20px;border-radius:50%;border:1.5px solid #6F83B3;display:grid;place-items:center;background:#fff;margin-top:1px}
.mod b{font-size:14.5px}
.mod small{color:var(--muted);font-size:12.5px}
.mod:hover{background:#FAFBFC}
.mod[aria-pressed=true]{background:var(--red-tint);border-color:var(--red)}
.mod[aria-pressed=true] .dot{border-color:var(--red)}
.mod[aria-pressed=true] .dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--red)}
.lock{opacity:.45;pointer-events:none}
.hint{font-size:12.5px;color:var(--green);font-weight:700;margin-top:6px}
.pctag{display:inline-block;font-size:12px;font-weight:700;color:var(--green);background:#EAF6EC;border-radius:4px;padding:1px 6px;margin-left:4px}
.pgroup .sub{margin:4px 0 8px;color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#fff;border:1.5px solid var(--field-line);border-radius:20px;padding:9px 15px;color:var(--blue);font-size:13.5px;font-weight:700}
.chip small{color:var(--muted);font-weight:400;margin-left:5px}
.chip:hover{background:#F6F9FF;border-color:var(--blue)}
.ro{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:9px 12px;min-height:46px}
.ro small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.po.off{opacity:.45;cursor:not-allowed}
.po.off b{font-weight:400}
.po.off .dot{border-color:#C3C9D3}
.po.off small{color:var(--orange-text);font-size:11.5px;display:block}
.po[role=checkbox] .dot{border-radius:4px}
.po[role=checkbox][aria-checked=true] .dot::after{border-radius:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

function nuevoEstado(convenio){
  return { convenio: convenio || { empresa:'', nit:'', asesor:'', pago:'', valorEmpresa:'', valorColaborador:'' },
    modalidad:'', planes:{ mascotas:[] }, titular:{ tipodoc:'CC' }, pagadorMismo:true, pagador:{},
    mascotas:[],
    conyuge:null, hijos:[], adicionales:[], beneficiarios:[],
    pago:{ valor:'' }, aut:{ datos:false, declaracion:false },
    firmaModo:'pantalla', firma:null, firmaRaw:null, observaciones:'' };
}

const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function getP(path){ return path.split('.').reduce((o,k)=> o==null ? undefined : o[k], S); }
function setP(path, val){ const ks = path.split('.'); let o = S; ks.slice(0,-1).forEach(k=>{ if(o[k]==null) o[k]={}; o=o[k]; }); o[ks.at(-1)] = val; }
function parseFecha(s){
  const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(s||''); if(!m) return null;
  const d = new Date(+m[3], +m[2]-1, +m[1]);
  if(d.getFullYear()!=+m[3] || d.getMonth()!=+m[2]-1 || d.getDate()!=+m[1]) return null;
  return d;
}
function edad(d, ref=new Date()){ let a = ref.getFullYear()-d.getFullYear(); const mm = ref.getMonth()-d.getMonth(); if(mm<0 || (mm===0 && ref.getDate()<d.getDate())) a--; return a; }
function meses(d, ref=new Date()){ let m = (ref.getFullYear()-d.getFullYear())*12 + ref.getMonth()-d.getMonth(); if(ref.getDate()<d.getDate()) m--; return m; }
function hoy(){ const d=new Date(); return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear(); }
function maskFecha(v){ const d=v.replace(/\D/g,'').slice(0,8); return d.length>4 ? d.slice(0,2)+'/'+d.slice(2,4)+'/'+d.slice(4) : d.length>2 ? d.slice(0,2)+'/'+d.slice(2) : d; }
function pesos(v){ const n = parseInt(String(v).replace(/\D/g,''),10); return isNaN(n) ? '' : '$' + n.toLocaleString('es-CO'); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'), 3600); }
function nombreCompleto(p){ if(!p) return ''; if(p.nombre) return p.nombre; return [p.nombres, p.apellidos || [p.apellido1,p.apellido2].filter(Boolean).join(' ')].filter(Boolean).join(' '); }
const modActual = () => MODALIDADES.find(m=>m.v===S.modalidad);

const gr_hogar = () => CATALOGO.find(g=>g.hogar);
function cobertura(){
  const m = modActual();
  // fam y adic salen exclusivamente de las asistencias elegidas; pol puede venir además de la modalidad.
  const c = { mod:m, fam:false, adic:false, pol:!!(m&&m.pol), hogar:false, mascota:false,
              edadMax:false, n:0, sel:[], niveles:[] };
  CATALOGO.forEach(gr => {
    const elegidas = [];
    const v = S.planes[gr.g]; if(v){ const o = gr.o.find(x=>x.v===v && !x.mascota); if(o) elegidas.push(o); }
    if(gr.hogar) (S.planes.mascotas||[]).forEach(pv => { const o = gr.o.find(x=>x.v===pv && x.mascota); if(o) elegidas.push(o); });
    if(!elegidas.length) return;
    c.n++;   // la categoría cuenta una vez para las reglas del plan
    elegidas.forEach(o => {
      c.sel.push(o.n.startsWith(gr.corto) || o.n.startsWith('Hogar') ? o.n : gr.corto + ' ' + o.n); c.niveles.push({ gr, o });
      if(o.fam) c.fam = true; if(o.adic) c.adic = true; if(o.pol) c.pol = true;
      if(o.mascota) c.mascota = true;
      if(gr.hogar && !o.mascota) c.hogar = true;
      if(o.v === 'MascotasPlena') c.hogar = true;
      if(gr.edadMax) c.edadMax = true;
    });
  });
  c.planesMascota = gr_hogar().o.filter(o=>o.mascota && (S.planes.mascotas||[]).includes(o.v));
  return c;
}
// Una opción queda bloqueada si su nivel no corresponde al plan elegido.
// Protección Hogar y Mascotas siempre está disponible.
function bloqueada(gr, o){ const m = modActual(); if(!m || !m.niveles || gr.hogar) return false; return !m.niveles.includes(o.v); }
function aplica(id){ const c = cobertura(); if(id==='familia') return c.fam || c.mascota; if(id==='beneficiarios') return c.pol; return true; }
// Hay descuento de nómina en Nómina (100 % colaborador) y en Cofinanciado (la parte del colaborador).
function hayDescuento(){ return S.convenio.pago==='Nomina' || S.convenio.pago==='Cofinanciado'; }
// El titular pagador solo aplica cuando el colaborador paga el 100 % por nómina.
function pagadorAplica(){ return S.convenio.pago==='Nomina'; }
const num = v => parseInt(String(v||'').replace(/\D/g,''),10) || 0;
// Porcentaje de una parte sobre el total, con un decimal: "55,6 %".
function pct(parte, total){ if(!(total>0)) return '0 %'; const p = Math.round(parte/total*1000)/10; return p.toLocaleString('es-CO') + ' %'; }
// Valor del plan (asistencias que no son de mascotas), según quién paga.
function valorPlan(){
  const p = S.convenio.pago;
  if(p==='Cofinanciado'){ const e = num(S.convenio.valorEmpresa), col = num(S.convenio.valorColaborador); return { empresa:e, colaborador:col, total:e+col }; }
  if(p==='Nomina'){ const col = num(S.pago.valor); return { empresa:0, colaborador:col, total:col }; }
  return { empresa:0, colaborador:0, total:0 };
}
// Cada asistencia de mascota tiene su propio valor.
// Empresa paga: todo a la empresa. Nómina: todo al colaborador.
// Cofinanciado: el reparto depende de cada empresa, así que se registra por mascota.
function valorMascota(p){
  const pago = S.convenio.pago;
  if(pago==='Cofinanciado'){ const e = num(p && p.valorEmpresa), col = num(p && p.valorColaborador); return { empresa:e, colaborador:col, total:e+col }; }
  const t = num(p && p.valor);
  return pago==='Empresa' ? { empresa:t, colaborador:0, total:t } : { empresa:0, colaborador:t, total:t };
}
function valores(){
  const c = cobertura(), hayPlan = c.niveles.some(x=>!x.o.mascota);
  const pl = hayPlan ? valorPlan() : { empresa:0, colaborador:0, total:0 };
  const pets = c.mascota ? S.mascotas.map(valorMascota) : [];
  const sum = k => pets.reduce((a,x)=>a+x[k],0);
  const empresa = pl.empresa + sum('empresa'), colaborador = pl.colaborador + sum('colaborador');
  return { hayPlan, plan:pl, pets, mascotas:sum('total'), empresa, colaborador, total: pl.total + sum('total'),
           descuento: hayDescuento() ? colaborador : 0 };
}
// Persona que firma: el pagador cuando hay descuento de nómina; si no, el titular afiliado.
function firmante(){
  if(pagadorAplica() && !S.pagadorMismo) return { p:S.pagador, rol:'Titular pagador' };
  return { p:S.titular, rol:pagadorAplica() ? 'Titular afiliado y pagador' : 'Titular afiliado' };
}

function fld(bind, label, o={}){
  const id = 'f_' + bind.replace(/\./g,'_');
  const val = getP(bind) ?? '';
  const attrs = [
    o.mode ? `inputmode="${o.mode}"` : '', o.max ? `maxlength="${o.max}"` : '',
    o.ph ? `placeholder="${esc(o.ph)}"` : '', o.auto ? `autocomplete="${o.auto}"` : 'autocomplete="off"',
    o.mask ? `data-mask="${o.mask}"` : ''
  ].join(' ');
  const opt = o.opt ? ' <span class="opt">(opcional)</span>' : '';
  const input = o.area
    ? `<textarea id="${id}" data-bind="${bind}" ${attrs}>${esc(val)}</textarea>`
    : `<input type="${o.type||'text'}" id="${id}" data-bind="${bind}" value="${esc(val)}" ${attrs}>`;
  const hint = o.hintId ? `<div class="hint" id="${o.hintId}">${o.hint||''}</div>` : '';
  return `<div class="f ${o.span||''}" data-f="${bind}"><label for="${id}">${esc(label)}${opt}</label>${input}${hint}<div class="msg"></div></div>`;
}
function sel(bind, label, opciones, o={}){
  const id = 'f_' + bind.replace(/\./g,'_'); const val = getP(bind) ?? '';
  const ops = ['<option value="">Seleccione</option>'].concat(opciones.map(v=>{
    const [a,b] = Array.isArray(v) ? v : [v,v];
    return `<option value="${esc(a)}" ${a===val?'selected':''}>${esc(b)}</option>`;
  })).join('');
  return `<div class="f ${o.span||''}" data-f="${bind}"><label for="${id}">${esc(label)}</label><select id="${id}" data-bind="${bind}">${ops}</select><div class="msg"></div></div>`;
}
function seg(bind, label, opciones, o={}){
  const val = getP(bind);
  const b = opciones.map(([v,t])=>`<button type="button" data-seg="${bind}" data-v="${v}" aria-pressed="${v===val}">${esc(t)}</button>`).join('');
  return `<div class="f ${o.span||''}" data-f="${bind}"><span class="lab">${esc(label)}</span><div class="seg ${o.vertical?'v':''}" role="group" aria-label="${esc(label)}">${b}</div><div class="msg"></div></div>`;
}
const TIPOS = [['CC','CC'],['CE','CE'],['TI','TI'],['RC','RC']];
function personaCampos(base, conParentesco){
  return `<div class="grid">
    ${conParentesco ? sel(base+'.parentesco','Parentesco con el titular',PARENTESCOS,{span:'s4'}) : ''}
    ${fld(base+'.nombres','Nombres',{span:'s4'})}
    ${fld(base+'.apellidos','Apellidos',{span:'s4'})}
    ${sel(base+'.tipodoc','Tipo de documento',TIPOS,{span:'s3'})}
    ${fld(base+'.numdoc','Número de documento',{span:'s5',max:15,mode:'numeric'})}
    ${fld(base+'.fnac','Fecha de nacimiento',{span:'s4',mask:'fecha',mode:'numeric',ph:'dd/mm/aaaa',max:10})}
    ${seg(base+'.genero','Género',[['M','M'],['F','F']],{span:'s4'})}
  </div>`;
}

R.plan = () => {

    : m.v==='Individual' ? `Marque las asistencias que quiera. Lleva ${c.n}.`

  const okRegla = m && c.n >= m.min && c.n <= m.max;
  return `
  <div class="step-h"><h2>Elija el plan</h2><p>Primero la modalidad, después las asistencias. El resumen de cobertura se actualiza con lo que elige.</p></div>
  <div id="vnotice"></div>
  <div class="block"><h3>1. Modalidad de contratación</h3>
    <div class="mods">
      ${MODALIDADES.map(x=>`<button type="button" class="mod" data-mod="${x.v}" aria-pressed="${S.modalidad===x.v}">

    </div>
  </div>
  <div class="block"><h3>2. Asistencias</h3>
    <span class="total ${okRegla?'ok':(m?'bad':'')}">${esc(reglaTxt)}</span>

    <div class="${m?'':'lock'}">
    ${CATALOGO.map(gr => {
      const opcion = o => { const off = bloqueada(gr, o);
        const on = o.mascota ? (S.planes.mascotas||[]).includes(o.v) : S.planes[gr.g]===o.v;
        return `<button type="button" class="po ${off?'off':''}" role="checkbox" data-plan="${gr.g}" data-v="${o.v}" ${o.mascota?'data-multi="1"':''} aria-checked="${on}" ${off?'disabled':''}>

          <span class="cov">${o.cubre}</span></button>`; };
      const hay = S.planes[gr.g] || (gr.hogar && (S.planes.mascotas||[]).length);
      const cab = `<div class="pgroup-h"><h3>${gr.t}</h3>${hay ? `<button type="button" class="clear" data-act="clear" data-g="${gr.g}">Quitar selección</button>` : ''}</div>`;

        <p class="sub">Vivienda: elija una opción.</p>
        <div class="opts" role="group" aria-label="Vivienda">${gr.o.filter(o=>!o.mascota).map(opcion).join('')}</div>

const MASCOTA_MIN_MESES = 3, MASCOTA_MAX_ANIOS = 10;
function edadMascotaTxt(p){
  const d = parseFecha(p && p.fnac); if(!d) return '';
  const a = edad(d), m = meses(d) - a*12;
  return a>0 ? `${a} año${a>1?'s':''}${m?' y '+m+' mes'+(m>1?'es':''):''}` : `${meses(d)} mes${meses(d)===1?'':'es'}`;
}
function planMascotaDe(p){ return gr_hogar().o.find(o=>o.mascota && o.v===(p&&p.plan)); }
function bloqueMascota(){
  const c = cobertura(); if(!c.mascota) return '';
  const pms = c.planesMascota;
  if(!S.mascotas.length) S.mascotas.push({ plan: pms.length===1 ? pms[0].v : '' });
  const n = S.mascotas.length;
  return `<div class="block"><h3>Mascotas</h3>
    <p>Cada mascota es una asistencia independiente con su propio valor mensual. Ingreso desde 3 meses hasta 10 años y 364 días.</p>
    ${S.mascotas.map((p,i)=>{ const e = edadMascotaTxt(p); return `<div class="person">
      <div class="person-h"><strong>Mascota ${i+1}</strong>${n>1?`<button type="button" class="rm" data-act="rm" data-list="mascotas" data-i="${i}">Quitar</button>`:''}</div>
      <div class="grid">
        ${seg('mascotas.'+i+'.plan','Asistencia',pms.map(o=>[o.v,o.n]),{span:'s8'})}
        ${seg('mascotas.'+i+'.tipo','Tipo de mascota',[['Perro','Perro'],['Gato','Gato']],{span:'s4'})}
        ${fld('mascotas.'+i+'.nombre','Nombre de la mascota',{span:'s4'})}
        ${fld('mascotas.'+i+'.raza','Raza',{span:'s4'})}
        ${fld('mascotas.'+i+'.color','Color',{span:'s4'})}
        ${fld('mascotas.'+i+'.fnac','Fecha de nacimiento',{span:'s4',mask:'fecha',mode:'numeric',ph:'dd/mm/aaaa',max:10})}
        <div class="f s4"><span class="lab">Edad</span><div class="total ${e?'ok':''}" id="edadMascota${i}">${e || 'Escriba la fecha de nacimiento'}</div></div>

  </div>`;
}

// Afiliados ya registrados que pueden designarse como beneficiarios.
function afiliadosRegistrados(){
  const c = cobertura(), out = [];
  if(c.fam){
    if(S.conyuge && S.conyuge.nombres) out.push({ origen:'conyuge', etiqueta:'Cónyuge', p:S.conyuge });
    S.hijos.forEach((h,i)=>{ if(h.nombres) out.push({ origen:'hijos.'+i, etiqueta:'Hijo(a) '+(i+1), p:h }); });
  }
  if(c.adic) S.adicionales.forEach((a,i)=>{ if(a.nombres) out.push({ origen:'adicionales.'+i, etiqueta:a.parentesco||'Adicional '+(i+1), p:a }); });
  return out;
}
function personaPorOrigen(o){
  if(o==='conyuge') return S.conyuge;
  const m = /^(hijos|adicionales)\.(\d+)$/.exec(o||'');
  return m ? (S[m[1]]||[])[+m[2]] : null;
}
// Datos efectivos de un beneficiario: si viene de un afiliado, se leen de ese registro.
function benDatos(b){
  if(!b.origen) return { nombre:b.nombre||'', parentesco:b.parentesco||'', tipodoc:b.tipodoc||'', numdoc:b.numdoc||'', fnac:b.fnac||'' };
  const p = personaPorOrigen(b.origen);
  if(!p) return { nombre:'', parentesco:'', tipodoc:'', numdoc:'', fnac:'' };
  const par = b.origen==='conyuge' ? 'Cónyuge' : b.origen.startsWith('hijos') ? 'Hijo(a)' : (p.parentesco || 'Adicional');
  return { nombre:nombreCompleto(p), parentesco:par, tipodoc:p.tipodoc||'', numdoc:p.numdoc||'', fnac:p.fnac||'' };
}
// Quita beneficiarios cuyo afiliado de origen ya no existe.
function limpiarBeneficiarios(){ S.beneficiarios = S.beneficiarios.filter(b=>!b.origen || personaPorOrigen(b.origen)); }

function valPersona(p, base, tipo, E, W){
  const req = (k, m) => { if(!String(p[k]||'').trim()) E.push([base+'.'+k, m]); };
  req('nombres','Escriba los nombres.'); req('apellidos','Escriba los apellidos.');
  req('tipodoc','Elija el tipo de documento.'); req('numdoc','Escriba el número de documento.');
  req('genero','Elija el género.');
  if(tipo==='adicional') req('parentesco','Elija el parentesco.');
  const d = parseFecha(p.fnac);
  if(!p.fnac) E.push([base+'.fnac','Escriba la fecha de nacimiento.']);
  else if(!d || d>new Date()) E.push([base+'.fnac','Fecha no válida. Use dd/mm/aaaa.']);
  else {
    const a = edad(d), X = CONFIG.EDAD;
    if(tipo==='conyuge' && (a<X.titularMin || a>X.titularMax)) E.push([base+'.fnac',`El cónyuge debe tener entre ${X.titularMin} y ${X.titularMax} años. Tiene ${a}.`]);
    if(tipo==='hijo' && meses(d) < X.hijoMinMeses) E.push([base+'.fnac',`Los hijos ingresan desde los ${X.hijoMinMeses} meses de nacidos.`]);
    if(tipo==='hijo' && a > X.hijoMax) E.push([base+'.fnac',`Los hijos ingresan hasta los ${X.hijoMax} años. Tiene ${a}. Puede inscribirse como adicional si el plan lo permite.`]);
    if(tipo==='adicional' && a < X.adicionalMin) E.push([base+'.fnac','Los adicionales deben ser mayores de edad.']);
    if(tipo==='adicional' && a > X.adicionalMax) W.push(`Adicional de ${a} años: confirme con Operación la edad máxima de ingreso.`);
    if(p.tipodoc){
      const esperado = a<7 ? 'RC' : a<18 ? 'TI' : 'CC o CE';
      if((a<7 && p.tipodoc!=='RC') || (a>=7 && a<18 && p.tipodoc!=='TI') || (a>=18 && !['CC','CE'].includes(p.tipodoc)))
        W.push(`${nombreCompleto(p)||'Una persona'} tiene ${a} años y registra ${p.tipodoc}. Lo usual es ${esperado}.`);
    }
  }
}
function valTitular(t, base, E, W, esAfiliado){
  const req = (k,m)=>{ if(!String(t[k]||'').trim()) E.push([base+'.'+k, m]); };
  req('nombres','Escriba los nombres.');
  if(esAfiliado) req('apellido1','Escriba el primer apellido.'); else req('apellidos','Escriba los apellidos.');
  req('tipodoc','Elija el tipo de documento.');
  req('ciudad','Escriba la ciudad de residencia.'); req('direccion','Escriba la dirección de residencia.');
  if(esAfiliado) req('genero','Elija el género.');
  if(!t.numdoc) E.push([base+'.numdoc','Escriba el número de documento.']);
  else if(t.tipodoc==='CC' && !/^\d{5,10}$/.test(t.numdoc)) E.push([base+'.numdoc','La cédula debe tener entre 5 y 10 dígitos, sin puntos.']);
  else if(t.tipodoc==='CE' && !/^[A-Za-z0-9]{3,15}$/.test(t.numdoc)) E.push([base+'.numdoc','Número de cédula de extranjería no válido.']);
  if(!/^3\d{9}$/.test(t.celular||'')) E.push([base+'.celular','Celular de 10 dígitos que empiece por 3.']);
  if(!String(t.correo||'').trim()) E.push([base+'.correo','Escriba el correo electrónico.']);
  else if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(t.correo)) E.push([base+'.correo','Correo no válido.']);
}
function validar(id){
  const E = [], W = [], c = cobertura(), X = CONFIG.EDAD;
  if(id==='convenio'){
    if(!S.convenio.empresa.trim()) E.push(['convenio.empresa','Escriba la empresa o fondo del convenio.']);
    if(!S.convenio.asesor.trim()) E.push(['convenio.asesor','Escriba su nombre.']);
    if(!S.convenio.pago) E.push(['convenio.pago','Elija quién paga los planes.']);
    if(S.convenio.pago==='Cofinanciado'){
      const v = valorPlan();
      if(!(v.empresa>0)) E.push(['convenio.valorEmpresa','Escriba el valor que cofinancia la empresa.']);
      if(!(v.colaborador>0)) E.push(['convenio.valorColaborador','Escriba el valor que paga el colaborador.']);
    }
  }
  if(id==='plan'){
    const m = c.mod;
    const sinUso = (S.planes.mascotas||[]).length > 1 ? '' : '';
    if(!m) E.push([null,'Elija la modalidad de contratación.']);
    else if(!c.n) E.push([null,'Marque al menos una asistencia.']);
    else if(c.n < m.min) E.push([null,`El ${m.n} exige ${m.min} asistencias como mínimo. Lleva ${c.n}.`]);
    else if(c.n > m.max) E.push([null,`El ${m.n} admite máximo ${m.max} asistencias. Lleva ${c.n}.`]);
    if(!c.fam && (S.conyuge || S.hijos.length)) W.push('El plan elegido no cubre familia. Los familiares registrados no se incluirán en el formulario.');
    if(!c.adic && S.adicionales.length) W.push('El plan elegido no admite adicionales. Los adicionales registrados no se incluirán.');
  }
  if(id==='titular'){
    valTitular(S.titular, 'titular', E, W, true);
    const fn = parseFecha(S.titular.fnac);
    if(!S.titular.fnac) E.push(['titular.fnac','Escriba la fecha de nacimiento.']);
    else if(!fn || fn>new Date()) E.push(['titular.fnac','Fecha no válida. Use dd/mm/aaaa.']);
    else {
      const a = edad(fn);
      if(a < X.titularMin) E.push(['titular.fnac','El titular debe ser mayor de edad.']);
      else if(c.edadMax && a > X.titularMax) E.push(['titular.fnac',`Supera la edad máxima de ingreso (${X.titularMax} años). Tiene ${a}. Solo puede tomar Protección Hogar o Mascotas.`]);
      else if(c.pol && a > X.polizaMax) W.push(`El titular tiene ${a} años: supera la edad de ingreso a la póliza (${X.polizaMax}). La asistencia aplica; confirme con Operación el tratamiento de la póliza.`);
    }
    if(pagadorAplica() && !S.pagadorMismo){
      if(!String(S.pagador.nombre||'').trim()) E.push(['pagador.nombre','Escriba el nombre completo del pagador.']);
      if(!S.pagador.numdoc) E.push(['pagador.numdoc','Escriba el número de cédula del pagador.']);
      else if(!/^\d{5,10}$/.test(S.pagador.numdoc)) E.push(['pagador.numdoc','La cédula debe tener entre 5 y 10 dígitos, sin puntos.']);
      if(S.pagador.numdoc && S.pagador.numdoc === S.titular.numdoc)
        W.push('El titular pagador tiene la misma cédula del afiliado. Si es la misma persona, marque la casilla de arriba.');
    }
  }
  if(id==='familia' && c.mascota){
    S.mascotas.forEach((p,i)=>{
      const k = 'mascotas.'+i;
      if(!planMascotaDe(p) || !(S.planes.mascotas||[]).includes(p.plan)) E.push([k+'.plan','Elija la asistencia para esta mascota.']);
      if(!p.tipo) E.push([k+'.tipo','Elija si es perro o gato.']);
      if(!String(p.nombre||'').trim()) E.push([k+'.nombre','Escriba el nombre de la mascota.']);
      if(!String(p.raza||'').trim()) E.push([k+'.raza','Escriba la raza.']);
      if(!String(p.color||'').trim()) E.push([k+'.color','Escriba el color.']);
      const d = parseFecha(p.fnac);
      if(!p.fnac) E.push([k+'.fnac','Escriba la fecha de nacimiento de la mascota.']);
      else if(!d || d>new Date()) E.push([k+'.fnac','Fecha no válida. Use dd/mm/aaaa.']);
      else if(meses(d) < MASCOTA_MIN_MESES) E.push([k+'.fnac',`La mascota ingresa desde los ${MASCOTA_MIN_MESES} meses. Hoy tiene ${meses(d)}.`]);
      else if(edad(d) > MASCOTA_MAX_ANIOS) E.push([k+'.fnac',`La mascota ingresa hasta los ${MASCOTA_MAX_ANIOS} años y 364 días. Hoy tiene ${edad(d)}.`]);
    });
  }
  if(id==='familia' && c.fam){
    if(S.conyuge) valPersona(S.conyuge,'conyuge','conyuge',E,W);
    S.hijos.forEach((h,i)=>valPersona(h,'hijos.'+i,'hijo',E,W));
    if(c.adic) S.adicionales.forEach((h,i)=>valPersona(h,'adicionales.'+i,'adicional',E,W));
    const docs = [S.titular.numdoc, S.conyuge && S.conyuge.numdoc, ...S.hijos.map(h=>h.numdoc), ...(c.adic?S.adicionales.map(h=>h.numdoc):[])].filter(Boolean);
    if(new Set(docs).size !== docs.length) E.push([null,'Hay números de documento repetidos entre las personas inscritas.']);
    if(!S.conyuge && !S.hijos.length && !(c.adic && S.adicionales.length)) W.push('No registró familiares. El plan los cubre: confirme que el colaborador no quiere inscribirlos.');
  }
  if(id==='beneficiarios' && c.pol && S.beneficiarios.length){
    let tot = 0;
    S.beneficiarios.forEach((b,i)=>{
      const k='beneficiarios.'+i;
      if(!b.origen){
        if(!String(b.nombre||'').trim()) E.push([k+'.nombre','Escriba nombres y apellidos.']);
        if(!b.tipodoc) E.push([k+'.tipodoc','Elija el tipo de documento.']);
        if(!b.numdoc) E.push([k+'.numdoc','Escriba el número de documento.']);
        if(!String(b.parentesco||'').trim()) E.push([k+'.parentesco','Escriba el parentesco.']);
        if(!b.fnac) E.push([k+'.fnac','Escriba la fecha de nacimiento.']);
        else if(!parseFecha(b.fnac)) E.push([k+'.fnac','Fecha no válida. Use dd/mm/aaaa.']);
      }
      const p = parseInt(b.pct,10); if(!(p>=1 && p<=100)) E.push([k+'.pct','Entre 1 y 100.']); else tot += p;
    });
    const docs = S.beneficiarios.map(b=>benDatos(b).numdoc).filter(Boolean);
    if(new Set(docs).size !== docs.length) E.push([null,'Hay beneficiarios repetidos.']);
    if(tot !== 100) E.push([null,`Los porcentajes suman ${tot} %. Deben sumar 100 %.`]);
  }
  if(id==='pago'){
    const c2 = cobertura();
    if(S.convenio.pago==='Nomina' && c2.niveles.some(x=>!x.o.mascota) && !(num(S.pago.valor)>0)) E.push(['pago.valor','Escriba el valor mensual del plan.']);
    if(c2.mascota) S.mascotas.forEach((p,i)=>{
      if(S.convenio.pago==='Cofinanciado'){
        const vacio = x => String(x ?? '').trim()==='';
        if(vacio(p.valorEmpresa)) E.push(['mascotas.'+i+'.valorEmpresa','Escriba lo que paga la empresa (0 si no aporta).']);
        if(vacio(p.valorColaborador)) E.push(['mascotas.'+i+'.valorColaborador','Escriba lo que paga el colaborador (0 si no aporta).']);
        if(!vacio(p.valorEmpresa) && !vacio(p.valorColaborador) && !(valorMascota(p).total>0))
          E.push([null,`La mascota ${i+1} tiene valor total $0. Revise el reparto.`]);
      } else if(!(num(p.valor)>0)) E.push(['mascotas.'+i+'.valor','Escriba el valor mensual de esta asistencia.']);
    });
    if(!S.aut.datos) E.push(['aut.datos','El colaborador debe aceptar el tratamiento de datos.']);
    if(!S.aut.declaracion) E.push(['aut.declaracion','El colaborador debe aceptar la declaración.']);
    if(S.firmaModo==='pantalla' && !S.firma) E.push(['firma','Falta la firma. Si firmará en papel, elija esa opción.']);
  }
  return { E, W };
}
function pintarValidacion(r){
  document.querySelectorAll('#step .err').forEach(el=>el.classList.remove('err'));
  document.querySelectorAll('#step .msg').forEach(el=>el.textContent='');
  const gen = [];
  r.E.forEach(([k,m])=>{
    const bx = k && document.querySelector(`#step [data-f="${k}"]`);
    if(bx){ bx.classList.add('err'); const msg = bx.querySelector('.msg'); if(msg) msg.textContent = m; else gen.push(m); }
    else gen.push(m);
  });
  const n = $('#vnotice');
  let html = '';
  if(gen.length) html += `<div class="notice bad"><strong>Revise antes de seguir</strong><ul>${gen.map(m=>`<li>${esc(m)}</li>`).join('')}</ul></div>`;
  if(r.W.length) html += `<div class="notice warn"><strong>Para tener en cuenta</strong><ul>${r.W.map(m=>`<li>${esc(m)}</li>`).join('')}</ul></div>`;
  if(n) n.innerHTML = html; else if(html) $('#step').insertAdjacentHTML('afterbegin', html);
  const first = document.querySelector('#step .err input, #step .err select, #step .err button, #step .notice.bad');
  if(first){ first.scrollIntoView({behavior:'smooth', block:'center'}); if(first.focus) first.focus({preventScroll:true}); }
}

function render(){
  const id = STEPS[cur].id;
  $('#step').innerHTML = R[id]();
  $('#rail').innerHTML = STEPS.map((s,i)=>{
    const skip = !aplica(s.id), cls = i===cur ? 'cur' : (i<maxVisto+1 && i<cur && !skip ? 'done' : '');
    return `<li class="${cls} ${skip?'skip':''}"><button type="button" data-go="${i}" ${i>maxVisto?'disabled':''} ${i===cur?'aria-current="step"':''}>
      <span class="n">${cls==='done'?'✓':i+1}</span>${s.t}${skip?' <small>(no aplica)</small>':''}</button></li>`;
  }).join('');
  $('#where').textContent = `Paso ${cur+1} de ${STEPS.length}`;
  $('#btnPrev').style.visibility = cur===0 ? 'hidden' : 'visible';
  $('#btnNext').textContent = id==='revision' ? (generado ? 'Nueva inscripción' : 'Generar PDF') : 'Siguiente';
  if(id==='pago') initPad();
  pintarCobertura();
}
function ir(i){ cur = Math.max(0, Math.min(STEPS.length-1, i)); maxVisto = Math.max(maxVisto, cur); render(); window.scrollTo({top:0, behavior:'smooth'}); }
function siguiente(){
  const id = STEPS[cur].id;
  if(id==='revision'){ if(generado) nuevaInscripcion(); else generar(); return; }
  const r = validar(id);
  if(r.E.length){ pintarValidacion(r); return; }
  if(r.W.length && siguiente._ok !== id){ pintarValidacion(r); siguiente._ok = id; toast('Revise los avisos y toque Siguiente para continuar.'); return; }
  siguiente._ok = null;
  let n = cur + 1; while(n < STEPS.length-1 && !aplica(STEPS[n].id)) n++;
  ir(n);
}
function anterior(){ siguiente._ok = null; let n = cur - 1; while(n > 0 && !aplica(STEPS[n].id)) n--; ir(n); }
function nuevaInscripcion(){ S = nuevoEstado(S.convenio); generado = null; maxVisto = 0; ir(0); }

/* Firma */
function initPad(){
  const cv = $('#pad'); if(!cv) return;
  const ratio = Math.max(window.devicePixelRatio||1, 1), r = cv.getBoundingClientRect();
  cv.width = Math.round(r.width*ratio); cv.height = Math.round(r.height*ratio);
  const ctx = cv.getContext('2d', { willReadFrequently:true }); ctx.scale(ratio, ratio);
  Object.assign(ctx, { lineWidth:2.4, lineCap:'round', lineJoin:'round', strokeStyle:'#0F1A3A', fillStyle:'#0F1A3A' });
  if(S.firmaRaw){ const img = new Image(); img.onload = ()=>ctx.drawImage(img, 0, 0, r.width, r.height); img.src = S.firmaRaw; }
  let on = false, last = null;
  const pos = e => { const b = cv.getBoundingClientRect(); return { x:e.clientX-b.left, y:e.clientY-b.top }; };
  cv.onpointerdown = e => { on = true; cv.setPointerCapture(e.pointerId); last = pos(e); ctx.beginPath(); ctx.arc(last.x,last.y,1.2,0,Math.PI*2); ctx.fill(); e.preventDefault(); };
  cv.onpointermove = e => { if(!on) return; const p = pos(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last = p; };
  const fin = () => { if(!on) return; on = false; S.firmaRaw = cv.toDataURL('image/png'); S.firma = recortar(cv); const s=$('#padState'); if(s) s.textContent='Firma registrada'; };
  cv.onpointerup = fin; cv.onpointercancel = fin;
}
function recortar(cv){
  const ctx = cv.getContext('2d', { willReadFrequently:true }), w = cv.width, h = cv.height, d = ctx.getImageData(0,0,w,h).data;
  let x0=w, y0=h, x1=-1, y1=-1;
  for(let y=0;y<h;y+=2) for(let x=0;x<w;x+=2) if(d[(y*w+x)*4+3] > 20){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
  if(x1<0) return null;
  const p = 12; x0=Math.max(0,x0-p); y0=Math.max(0,y0-p); x1=Math.min(w,x1+p); y1=Math.min(h,y1+p);
  const o = document.createElement('canvas'); o.width = x1-x0; o.height = y1-y0;
  o.getContext('2d').drawImage(cv, x0, y0, o.width, o.height, 0, 0, o.width, o.height);
  return { url:o.toDataURL('image/png'), w:o.width, h:o.height };
}

async function construirPDF({ enBlanco=false }={}){
  const { PDFDocument, StandardFonts } = PDFLib;
  const pdf = await PDFDocument.load(b64(TEMPLATE_B64));
  if(enBlanco) return pdf.save();
  const form = pdf.getForm(), helv = await pdf.embedFont(StandardFonts.Helvetica), c = cobertura();
  const T = (name, val) => {
    let v = pdfSafe(val); if(!v) return;
    const f = form.getTextField(name), ml = f.getMaxLength(); if(ml && v.length>ml) v = v.slice(0, ml);
    f.setText(v);
    const w = f.acroField.getWidgets()[0].getRectangle().width - 5;
    let size = /^(fam|ben)/.test(name) ? 8 : 9; while(size>5 && helv.widthOfTextAtSize(v,size)>w) size -= 0.5;
    f.setFontSize(size);
  };
  const D = (name, v) => { if(v) try { form.getDropdown(name).select(pdfSafe(v)); } catch(e){ console.warn('opción no válida', name, v); } };
  const K = (name, on) => { if(on) form.getCheckBox(name).check(); };
  // 1. Plan
  if(S.modalidad) K('mod_' + S.modalidad.toLowerCase(), true);
  CATALOGO.forEach(gr => { const v = S.planes[gr.g]; if(v) K(`plan_${gr.g}_${v}`, true); });
  (S.planes.mascotas||[]).forEach(v => K(`plan_hogar_${v}`, true));
  // 2. Titular afiliado
  const t = S.titular;
  T('tit_nombres',t.nombres); T('tit_apellido1',t.apellido1); T('tit_apellido2',t.apellido2);
  K('tit_tipodoc_' + (t.tipodoc||'CC'), true); T('tit_numdoc',t.numdoc);
  T('tit_fnac',t.fnac); if(t.genero) K('tit_genero_' + t.genero, true);
  T('tit_celular',t.celular); T('tit_correo',t.correo);
  T('tit_ciudad',t.ciudad); T('tit_barrio',t.barrio); T('tit_direccion',t.direccion);
  // 3. Titular pagador
  if(pagadorAplica()){
    if(S.pagadorMismo) K('pag_misma', true);
    else { T('pag_nombre', S.pagador.nombre); T('pag_numdoc', S.pagador.numdoc); }
  }
  // 3b. Mascota
  if(c.mascota) S.mascotas.slice(0, 3).forEach((p,i)=>{ const j=i+1;
    D(`mas${j}_plan`,(planMascotaDe(p)||{}).n); D(`mas${j}_tipo`,p.tipo); T(`mas${j}_nombre`,p.nombre); T(`mas${j}_raza`,p.raza);
    T(`mas${j}_color`,p.color); T(`mas${j}_fnac`,p.fnac); T(`mas${j}_valor`, pesos(valorMascota(p).total).replace('$','')); });
  // 4. Familia
  const persona = (i, p) => { if(!p) return;
    T(`fam${i}_nombres`,p.nombres); T(`fam${i}_apellidos`,p.apellidos); D(`fam${i}_tipodoc`,p.tipodoc);
    T(`fam${i}_numdoc`,p.numdoc); T(`fam${i}_fnac`,p.fnac); D(`fam${i}_genero`,p.genero);
    if(i>=6 && p.parentesco) D(`fam${i}_parentesco`, p.parentesco); };
  if(c.fam){ persona(1, S.conyuge); S.hijos.forEach((h,i)=>persona(2+i, h)); if(c.adic) S.adicionales.forEach((a,i)=>persona(6+i, a)); }
  // 5. Beneficiarios
  if(c.pol) S.beneficiarios.forEach((b,i)=>{ const j=i+1, d=benDatos(b);
    T(`ben${j}_nombre`,d.nombre); D(`ben${j}_tipodoc`,d.tipodoc); T(`ben${j}_numdoc`,d.numdoc);
    T(`ben${j}_parentesco`,d.parentesco); T(`ben${j}_pct`,b.pct); T(`ben${j}_fnac`,d.fnac); });
  // 6. Pago
  if(S.convenio.pago) K('formapago_' + S.convenio.pago.toLowerCase(), true);
  if(hayDescuento()){ T('pago_empresa', S.convenio.empresa); T('pago_valor', pesos(valores().descuento).replace('$','')); }
  // 7. Autorizaciones, firma y asesor
  K('aut_datos', S.aut.datos); K('aut_declaracion', S.aut.declaracion);
  const f = firmante();
  T('firma_documento', ((f.p.tipodoc||'CC') + ' ' + (f.p.numdoc||'')).trim()); T('firma_fecha', hoy());
  T('asesor_nombre', S.convenio.asesor); T('asesor_fecha', hoy()); T('asesor_empresa_nit', S.convenio.nit);
  T('observaciones', S.observaciones);
  form.updateFieldAppearances(helv);
  form.flatten();
  if(S.firmaModo==='pantalla' && S.firma){
    const png = await pdf.embedPng(S.firma.url), B = FIRMA_BOX;
    const k = Math.min(B.w / S.firma.w, B.h / S.firma.h), w = S.firma.w*k, h = S.firma.h*k;
    pdf.getPages()[B.page-1].drawImage(png, { x: B.x + (B.w-w)/2, y: B.y + (B.h-h)/2, width:w, height:h });
  }
  if(c.mascota && S.mascotas.length > 3) await anexoMascotas(pdf, helv);
  pdf.setTitle('Inscripción Enel Bienestar 360 - ' + pdfSafe(nombreCompleto(t)));
  pdf.setAuthor('Enel Colombia - Canal Empresarial B2B2C'); pdf.setLanguage('es-CO');
  return pdf.save();
}

/* =====================================================================
   CONSOLIDADO (Excel / CSV)
   Una fila por asistencia contratada. En cada fila van el titular afiliado,
   el titular pagador (si aplica) y los afiliados y beneficiarios que cubre
   esa asistencia, repartidos en columnas.
   ===================================================================== */
function edadDe(f){ const d = parseFecha(f); return d ? edad(d) : ''; }
function mascotaTxt(p){
  if(!p || !p.tipo) return '';
  const e = edadMascotaTxt(p);
  return [p.tipo, p.nombre, p.raza, p.color, e].filter(Boolean).join('/') + (p.fnac ? ` (${p.fnac})` : '');
}
const COLS_PERSONA = ['nombres','apellidos','tipo_doc','num_doc','fecha_nac','genero'];
// Orden exacto definido por el negocio para el consolidado.
const COLS = (() => {
  const c = ['id_inscripcion','fecha','asesor','empresa','nit','pagador_nombre','pagador_cedula',
             'titular_nombres','titular_apellidos','titular_tipo_doc','titular_num_doc','titular_fecha_nac',
             'titular_edad','titular_genero','titular_celular','titular_correo','titular_ciudad','titular_barrio',
             'titular_direccion','modalidad','asistencia','plan','cubre_a','pago',
             'valor_empresa','valor_colaborador','valor_mensual','mascota'];
  COLS_PERSONA.forEach(k=>c.push('conyuge_'+k));
  for(let i=1;i<=CONFIG.MAX_HIJOS;i++) COLS_PERSONA.forEach(k=>c.push(`hijo${i}_${k}`));
  for(let i=1;i<=CONFIG.MAX_ADICIONALES;i++){ c.push(`adicional${i}_parentesco`); COLS_PERSONA.forEach(k=>c.push(`adicional${i}_${k}`)); }
  for(let i=1;i<=CONFIG.MAX_BENEFICIARIOS;i++) c.push(`beneficiario${i}_nombre`,`beneficiario${i}_parentesco`,
    `beneficiario${i}_tipo_doc`,`beneficiario${i}_num_doc`,`beneficiario${i}_fecha_nac`,`beneficiario${i}_porcentaje`);
  return c;
})();
function persona(pref, p, fila){
  if(!p) return;
  fila[pref+'nombres'] = p.nombres || '';
  fila[pref+'apellidos'] = p.apellidos || '';
  fila[pref+'tipo_doc'] = p.tipodoc || '';
  fila[pref+'num_doc'] = p.numdoc || '';
  fila[pref+'fecha_nac'] = p.fnac || '';
  fila[pref+'genero'] = p.genero || '';
}
function filasCSV(id, nombreArchivo){
  const c = cobertura(), t = S.titular, m = c.mod, v = valores();
  const base = { id_inscripcion:id, fecha:hoy(), asesor:S.convenio.asesor, empresa:S.convenio.empresa, nit:S.convenio.nit,
    pagador_nombre: pagadorAplica() ? (S.pagadorMismo ? nombreCompleto(t) : (S.pagador.nombre||'')) : '',
    pagador_cedula: pagadorAplica() ? (S.pagadorMismo ? (t.numdoc||'') : (S.pagador.numdoc||'')) : '',
    titular_nombres:t.nombres||'', titular_apellidos:[t.apellido1,t.apellido2].filter(Boolean).join(' '),
    titular_tipo_doc:t.tipodoc||'', titular_num_doc:t.numdoc||'', titular_fecha_nac:t.fnac||'', titular_edad:edadDe(t.fnac),
    titular_genero:t.genero||'', titular_celular:t.celular||'', titular_correo:t.correo||'', titular_ciudad:t.ciudad||'',
    titular_barrio:t.barrio||'', titular_direccion:t.direccion||'',
    modalidad:m ? m.n : '', pago:PAGO[S.convenio.pago]||'' };
  // La póliza puede venir de la asistencia o, si ninguna la trae, del plan Familiar/Integral.
  const polDePlan = !!(m && m.pol) && !c.niveles.some(x=>x.o.pol);
  // Cada mascota es una asistencia: la opción de mascotas se expande en una fila por mascota.
  // Una fila por asistencia: las del plan, y luego una por cada mascota con su propia asistencia.
  const items = c.niveles.filter(x=>!x.o.mascota).map(({ gr, o }) => ({ gr, o, pet:null }))
    .concat(c.mascota ? S.mascotas.map(p => ({ gr:gr_hogar(), o:planMascotaDe(p) || c.planesMascota[0], pet:p })) : []);
  const primeraPlan = items.findIndex(x=>!x.pet);
  return items.map(({ gr, o, pet }, idx) => {
    const inc = { fam:!!o.fam, adic:!!o.adic, pol:!!(o.pol || polDePlan) };
    const f = Object.assign({}, base, { asistencia:gr.corto, plan:o.n,
      cubre_a: o.mascota ? 'Titular y mascota'
             : inc.adic ? 'Titular, cónyuge, hijos y adicionales'
             : inc.fam ? 'Titular, cónyuge e hijos' : 'Titular',
      // Plan: el valor va una sola vez, en la primera fila del plan. Mascotas: cada fila lleva el valor de esa asistencia.
      ...(pet ? { valor_empresa: valorMascota(pet).empresa || '', valor_colaborador: valorMascota(pet).colaborador || '', valor_mensual: valorMascota(pet).total || '' }
              : idx === primeraPlan ? { valor_empresa: v.plan.empresa || '', valor_colaborador: v.plan.colaborador || '', valor_mensual: v.plan.total || '' }
              : { valor_empresa:'', valor_colaborador:'', valor_mensual:'' }),
      mascota: pet ? mascotaTxt(pet) : '' });
    if(pet){ f.plan = (planMascotaDe(pet)||o).n; }
    if(inc.fam){
      persona('conyuge_', S.conyuge, f);
      S.hijos.forEach((h,i)=>persona(`hijo${i+1}_`, h, f));
    }
    if(inc.adic) S.adicionales.forEach((a,i)=>{ f[`adicional${i+1}_parentesco`] = a.parentesco || ''; persona(`adicional${i+1}_`, a, f); });
    if(inc.pol) S.beneficiarios.forEach((b,i)=>{ const j=i+1, d=benDatos(b);
      f[`beneficiario${j}_nombre`] = d.nombre; f[`beneficiario${j}_parentesco`] = d.parentesco;
      f[`beneficiario${j}_tipo_doc`] = d.tipodoc; f[`beneficiario${j}_num_doc`] = d.numdoc;
      f[`beneficiario${j}_fecha_nac`] = d.fnac; f[`beneficiario${j}_porcentaje`] = b.pct || ''; });
    return f;
  });
}

  if(b==='pago.valor' || /^mascotas\.\d+\.valor(Empresa|Colaborador)?$/.test(b)){
    const v = valores(), a=$('#totalPago'), d=$('#totalDescuento'), em=$('#totalEmpresa');
    if(a) a.textContent = pesos(v.total) || '$0'; if(d) d.textContent = pesos(v.descuento) || '$0'; if(em) em.textContent = pesos(v.empresa) || '$0';
    const mv = /^mascotas\.(\d+)\./.exec(b);
    if(mv){ const vm = valorMascota(S.mascotas[+mv[1]]), tm = $('#totalMascota'+mv[1]), me = $('#pctME'+mv[1]), mc = $('#pctMC'+mv[1]);
      if(tm) tm.textContent = pesos(vm.total) || '$0';
      if(me) me.textContent = 'Empresa: ' + pct(vm.empresa, vm.total);
      if(mc) mc.textContent = 'Colaborador: ' + pct(vm.colaborador, vm.total); }
    const tpe = $('#pctTotEmpresa'); if(tpe) tpe.textContent = pct(v.empresa, v.total);
    const tpc = $('#pctTotDescuento'); if(tpc) tpc.textContent = pct(v.descuento, v.total); }
  const mm = /^mascotas\.(\d+)\.fnac$/.exec(b);
  if(mm){ const el2=$('#edadMascota'+mm[1]); if(el2){ const e=edadMascotaTxt(S.mascotas[+mm[1]]); el2.textContent = e || 'Escriba la fecha de nacimiento'; el2.className='total '+(e?'ok':''); } }
  if(/^beneficiarios\.\d+\.pct$/.test(b)){ const tot = S.beneficiarios.reduce((a,x)=>a+(parseInt(x.pct,10)||0),0), tt=$('#total'); if(tt){ tt.textContent=`Total asignado: ${tot} % de 100 %`; tt.className='total '+(tot===100?'ok':'bad'); } }
  siguiente._ok = null; pintarCobertura();
});
document.addEventListener('change', e => {
  const el = e.target;
  if(el.tagName==='SELECT' && el.dataset.bind){ setP(el.dataset.bind, el.value); el.closest('.err') && el.closest('.err').classList.remove('err'); siguiente._ok=null; }
  if(el.dataset.check){
    setP(el.dataset.check, el.checked);
    const ch = el.closest('.chk'); if(ch) ch.classList.remove('err');
    if(el.dataset.check==='pagadorMismo'){ const y = window.scrollY; render(); window.scrollTo(0,y); }
  }
});
document.addEventListener('click', e => {
  const el = e.target.closest('button'); if(!el) return;
  const y = window.scrollY;
  if(el.dataset.mod){
    S.modalidad = S.modalidad===el.dataset.mod ? '' : el.dataset.mod;
    siguiente._ok = null; render(); window.scrollTo(0,y); return;
  }
  if(el.dataset.plan){
    const g = el.dataset.plan, v = el.dataset.v;
    if(el.dataset.multi){
      const a = S.planes.mascotas = S.planes.mascotas || [];
      const i = a.indexOf(v); if(i>=0) a.splice(i,1); else a.push(v);
      // Mascotas que tenían un plan que se quitó quedan sin plan hasta que se elija otro.
      S.mascotas.forEach(p=>{ if(p.plan && !a.includes(p.plan)) p.plan = a.length===1 ? a[0] : ''; });
      if(a.length && !S.mascotas.length) S.mascotas.push({ plan: a.length===1 ? a[0] : '' });
    } else S.planes[g] = S.planes[g]===v ? null : v;
    siguiente._ok = null; render(); window.scrollTo(0,y); return;
  }
  if(el.dataset.seg){
    setP(el.dataset.seg, el.dataset.v); siguiente._ok = null;
    if(el.dataset.seg==='firmaModo' || el.dataset.seg==='convenio.pago'){ render(); window.scrollTo(0,y); return; }
    el.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', x===el));
    const bx = el.closest('.err'); if(bx) bx.classList.remove('err');
    pintarCobertura(); return;
  }
  if(el.dataset.go){ siguiente._ok = null; ir(+el.dataset.go); return; }
  const act = el.dataset.act; if(!act) return;
  if(act==='clear'){ S.planes[el.dataset.g] = null; if(CATALOGO.find(g=>g.g===el.dataset.g).hogar) S.planes.mascotas = []; render(); window.scrollTo(0,y); }
  if(act==='copiareparto'){ const p0 = S.mascotas[0]||{}; S.mascotas.forEach(p=>{ p.valorEmpresa = p0.valorEmpresa; p.valorColaborador = p0.valorColaborador; });
    render(); window.scrollTo(0,y); return; }
  if(act==='addben'){ S.beneficiarios.push({ origen:el.dataset.origen, pct:'' }); render(); window.scrollTo(0,y); return; }
  if(act==='add'){ const l = el.dataset.list; if(l==='conyuge') S.conyuge = {};
    else if(l==='mascotas'){ const pm = S.planes.mascotas||[]; S.mascotas.push({ plan: pm.length===1 ? pm[0] : '' }); }
    else S[l].push({}); render(); window.scrollTo(0,y); }
  if(act==='rm'){ const l = el.dataset.list; if(l==='conyuge') S.conyuge = null; else S[l].splice(+el.dataset.i,1); render(); window.scrollTo(0,y); }
  if(act==='clearpad'){ S.firma = null; S.firmaRaw = null; render(); window.scrollTo(0,y); }
  if(act==='redownload' && generado) descargar(generado.bytes, generado.nombre, 'application/pdf');
  if(act==='nueva') nuevaInscripcion();
});
$('#btnNext').onclick = siguiente;
$('#btnPrev').onclick = anterior;
$('#btnCsv').onclick = exportarCSV;
$('#btnBlank').onclick = async () => descargar(await construirPDF({enBlanco:true}), 'Formulario_Inscripcion_Enel_Bienestar_360_diligenciable.pdf', 'application/pdf');
window.addEventListener('beforeunload', e => { if(registros.length && !exportado){ e.preventDefault(); e.returnValue = ''; } });
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(()=>{ if(STEPS[cur].id==='pago') initPad(); }, 200); });
render();

</script>
</body>
